services:
  - type: web
    name: contract-reviewer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/meta
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-chat
      # 在 Render 控制台里填，不要写进仓库
      - key: LLM_API_KEY
        sync: false
